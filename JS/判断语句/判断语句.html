<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body>
    <script>
      let age = 18;
      if (age > 18) {
        console.log("已成年");
      } else {
        console.log("未成年");
      }
      let time = 5;
      if (time < 12) {
        alert("上午好！"); //网页弹出窗口
      } else if (time < 18) {
        alert("下午好！");
      } else {
        alert("晚上好！");
      }
    </script>
  </body>
