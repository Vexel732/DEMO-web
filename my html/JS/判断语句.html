<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // ===== 本文件演示：if/else 分支判断、for 循环、while 循环、break 与 continue =====

      /* 下面这一整段被块注释关掉了，不会执行；把注释符号去掉就能看到效果：
         第一段 if/else：条件成立走 if，不成立走 else；
         第二段 if/else if/else：从上往下判断，命中一个分支就不再往下走。
         小坑：块注释不能嵌套，里面再写一次“星号+斜杠”，注释就会提前结束 */
      /*let age = 18;
      if (age > 18) {
        console.log("已成年");
      } else {
        console.log("未成年");
      }
      let time = 5;
      if (time < 12) {
        alert("上午好！"); //网页弹出窗口
      } else if (time < 18) {
        alert("下午好！");
      } else {
        alert("晚上好！");
      }*/

      // ---------- 1. for 循环 ----------
      // for 的三个部分：① let i = 0 初始化（只执行一次）② i <= 10 条件（每轮开始前检查）
      //               ③ i++ 步进（每轮结束后执行，相当于 i = i + 1）
        console.log("for循环打印1到10");
        for (let i = 0; i <= 10; i++) {/*有限循环，打印1到10*/
          console.log(i);
        }
        // ---------- 2. while 循环 ----------
        // while 只写“条件”，所以计数变量必须先初始化好，否则变量不存在；
        // 也别忘了在循环体里自增，不然条件永远成立会变成死循环
        console.log("while循环打印1到10");
        let count =1
        // 行尾没写分号也能运行：JS 会自动补分号（ASI），建议统一加上更清晰
        while (count <= 10) {
          console.log(count);
          count++;/*递增count变量的值*/
        }
        console.log("while循环打印");
        /*循环，打印1到10*/ 
        // ---------- 3. break 与 continue ----------
        // 注意循环变量叫 a，不是 i（注释里的 i 是笔误），a 会从 1 取到 9
        for (let a = 1; a < 10; a++) {
          if (a === 5) {
            // continue：跳过本轮剩下的代码，直接开始下一轮（所以打印结果里没有 5）
            continue; /*当i等于5时，跳过 本次循环*/
          }
          // == 是“松散相等”，会先把两边转成同一类型再比较；=== 是“严格相等”，类型也必须一样
          if (a==7) {
            // break：立刻结束整个循环（所以 7、8、9 都不会打印）
            break;/*当i等于7时，跳出循环*/
          }
          console.log(a);
        }
      // 小结：知道循环几次用 for，只知道“条件成立就一直做”用 while；
      //       break = 结束整个循环，continue = 只跳过这一次
    </script>
  </body>
</html>
