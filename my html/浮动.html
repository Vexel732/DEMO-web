<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      /* ===== float 浮动：让元素脱离普通文档流，贴到父容器的左边或右边 =====
         缺点：元素浮动后父容器“算不出”它的高度（看起来像塌陷），所以要清除浮动。 */
      .father {
        background-color: aqua;
        height: 150px; /* 手动写死高度，不写就要靠下面的 overflow 撑开 */
        overflow: hidden; /*清除浮动，自动撑开高度*/
        /* 一句话原理：overflow 不是默认值 visible 时，父元素会重新把浮动的子元素包住 */
      }
      .left {
        width: 100px; /* 浮动元素必须给宽度，否则宽度由内容决定，位置很难控制 */
        background-color: orangered;
        float: left; /* 靠左浮动，后面的文字会绕着它排 */
      }
      .right {
        width: 100px;
        background-color: blueviolet;
        float: right; /* 靠右浮动，和左浮动各占一边 */
      }
    </style>
  </head>
  <body>
    <!-- 父盒子里两个子盒子：一个左浮、一个右浮，就是常见的“左右分栏” -->
    <div class="father">
      <div class="left">左浮动</div>
      <div class="right">右浮动</div>
    </div>
  </body>
</html>
