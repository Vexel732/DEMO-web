<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>属性练习</title>
  </head>
  <body>
    <!-- 超链接：href 填要跳转的地址，可以写网络地址，也可以写本地文件路径 -->
    <a href="https://www.bilibili.com/">blibli超链接</a>
    <!--超链接-->
    <br />
    <!--换行-->
    <a href="https://www.bilibili.com/" target="_blank">2超链接</a>
    <!--target表示超链接的打开方式-->
    <!-- target="_blank" 表示在新标签页打开；不写则默认在当前页跳转 -->
    <hr />
    <!--分割线-->
    <!-- src 是图片地址（这里是同目录下的 111.jpg）；宽高写死会让图片按比例拉伸或压扁 -->
    <img src="111.jpg" alt="" width="100" height="200" />
    <hr />
    <img
      src="https://gips3.baidu.com/it/u=1821127123,1149655687&fm=3028&app=3028&f=JPEG&fmt=auto?w=720&h=1280"
      alt=""
      width="100"
      height="100"
    />
    <!-- 上面这张图用的是完整网络地址（http 开头），所以能直接显示 -->
    <!--alt表示scr不存在时显示什么-->
    <!-- 小结：src = 图片地址，alt = 加载失败时的替代文字（读屏器也会念），宽高 = 显示大小 -->
    <hr />
    <img
      src="3.baidu.com/it/u=1821127123,1149655687&fm=3028&app=3028&f=JPEG&fmt=auto?w=720&h=1280"
      alt="图片无法显示"
    />
    <!-- 上面这个 src 少了开头的 https://，浏览器会把它当成相对路径 → 加载失败，
         所以页面上显示的是 alt 里的文字“图片无法显示” -->
    <!-- 下面这个链接跳到本地另一个文件，用的是 VS Code Live Server 的地址（127.0.0.1:5500），
         换台电脑或没开服务器就打不开；实际项目里写相对路径更稳 -->
    <a
      href="http://127.0.0.1:5500/%E6%96%87%E6%9C%AC%E7%BB%83%E4%B9%A0,%E5%90%AB%E5%A4%96%E9%83%A8CSS%E5%AF%BC%E5%85%A5.html"
      target="_blank"
      >点这里跳转</a
    >
  </body>
</html>
