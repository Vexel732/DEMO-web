<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box2 {
        background-color: aquamarine;
        height: 100px;
        width: 100px;
      }
      #box1 {
        background-color: blue;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>
  <body>
    <div id="box1">这是一个ID选择器标签</div>
    <div class="box2">这是一个类选择器标签</div>
    <div>普通div标签</div>
    <button>这是一个按钮</button>

    <script>
      var element_id = document.getElementById("box1"); //获取节点存入变量
      console.log(element_id); //输出节点

      var element_class = document.getElementsByClassName("box2")[0];
      console.log(element_class);
      //获取class

      var element_tag = document.getElementsByTagName("div")[2];
      console.log(element_tag);

      let a = "测试";
      element_id.innerHTML = a; //把可以解析HTML语义，比如可以写入超链接
      element_class.innerText = "修改类选择器文本";

      //通过DOM绑定事件
    </script>
  </body>
</html>
